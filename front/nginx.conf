server {
    listen 80;
    server_name localhost;

    # Root directory for serving content
    root /usr/share/nginx/html;
    index index.html index.htm;

    # General fallback for Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for index.html so the client always gets the latest asset references
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Disable caching for Service Worker and Web Manifest to allow instant updates
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Cache hashed assets aggressively (Vite output under assets)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache workbox dependency js files since they are hashed
    location ~* workbox-[a-f0-9]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

