spring:
  autoconfigure:
    exclude:
      - org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: jwt-test-secret-key-only-for-local-testing-purposes-do-not-use-in-production-1234567890
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
  mail:
    from: noreply@mybalance.com

telegram:
  bot:
    token: mock-token
    username: mock-username

gemini:
  api:
    key: mock-key
    model: gemini-2.5-flash
