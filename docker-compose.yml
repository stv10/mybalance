version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mybalance-db
    environment:
      POSTGRES_DB: mybalance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: mybalance-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/mybalance
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: jwt-development-secret-key-only-for-local-testing-purposes-1234567890
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:3000,http://localhost:5173
      # Puedes añadir tokens y llaves del bot de Telegram o Gemini si deseas utilizarlos en Docker:
      # TELEGRAM_BOT_TOKEN: ""
      # TELEGRAM_BOT_USERNAME: ""
      # GEMINI_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080/api/v1
    container_name: mybalance-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
